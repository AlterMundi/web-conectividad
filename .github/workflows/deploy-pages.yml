name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  enforce-https:
    name: Wait for and enforce HTTPS
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Enable HTTPS when the certificate is available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 75); do
            if gh api --method PUT "repos/${GH_REPO}/pages" -F https_enforced=true; then
              echo "HTTPS is enforced for ${GH_REPO}."
              exit 0
            fi

            echo "Certificate not available yet (attempt ${attempt}/75); retrying in 60 seconds."
            sleep 60
          done

          echo "GitHub Pages did not expose the certificate within 75 minutes." >&2
          exit 1
